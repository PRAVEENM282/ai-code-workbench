[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-workbench"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.140,<1",
  "httpx>=0.28,<1",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
  "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
  "opentelemetry-instrumentation-httpx>=0.57b0,<1",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6,<7",
  "sqlalchemy[asyncio]>=2.0.50,<2.1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
analysis = [
  "bandit>=1.8,<2",
  "flake8>=7.3,<8",
  "pylint>=3.3,<4",
]
dev = [
  "black>=25,<27",
  "httpx>=0.28,<1",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=6.2,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=workbench --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["workbench"]
